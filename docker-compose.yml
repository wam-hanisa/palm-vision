services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${DB_NAME:-palmvision}
      POSTGRES_USER: ${DB_USER:-palmvision}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-palmvision}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-palmvision}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      # Trained ML weights live in the sibling palm-vision-ml repo (the
      # actual training project), not duplicated into this repo — see
      # BUILD_STATUS.md's "real models referenced from palm-vision-ml"
      # update for why. Read-only: this container only ever loads these
      # files, never writes them. If you don't have palm-vision-ml checked
      # out as a sibling of this repo, comment this out and leave
      # DETECTION_MODEL_PATH/CLASSIFICATION_MODEL_PATH blank in .env — the
      # app falls back to the honest stub detector/classifier either way.
      - ../palm-vision-ml/tree_health_pipeline/trained_models:/ml_models:ro
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A palmvision worker -l info
    volumes:
      - .:/app
      # Trained ML weights live in the sibling palm-vision-ml repo (the
      # actual training project), not duplicated into this repo — see
      # BUILD_STATUS.md's "real models referenced from palm-vision-ml"
      # update for why. Read-only: this container only ever loads these
      # files, never writes them. If you don't have palm-vision-ml checked
      # out as a sibling of this repo, comment this out and leave
      # DETECTION_MODEL_PATH/CLASSIFICATION_MODEL_PATH blank in .env — the
      # app falls back to the honest stub detector/classifier either way.
      - ../palm-vision-ml/tree_health_pipeline/trained_models:/ml_models:ro
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A palmvision beat -l info
    volumes:
      - .:/app
      # Trained ML weights live in the sibling palm-vision-ml repo (the
      # actual training project), not duplicated into this repo — see
      # BUILD_STATUS.md's "real models referenced from palm-vision-ml"
      # update for why. Read-only: this container only ever loads these
      # files, never writes them. If you don't have palm-vision-ml checked
      # out as a sibling of this repo, comment this out and leave
      # DETECTION_MODEL_PATH/CLASSIFICATION_MODEL_PATH blank in .env — the
      # app falls back to the honest stub detector/classifier either way.
      - ../palm-vision-ml/tree_health_pipeline/trained_models:/ml_models:ro
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
