<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Palm Vision — Field</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2F4A38">
  <link rel="apple-touch-icon" href="/pwa/icons/icon-192.png">
  <link rel="icon" href="/pwa/icons/icon-192.png">
  <!-- Preloaded so the first paint uses Public Sans rather than flashing a
       system fallback; the file is same-origin and precached by the SW. -->
  <link rel="preload" href="/pwa/fonts/public-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/pwa/css/app.css">
</head>
<body>
  <div id="app">
    <div class="screen"><div class="loading-state" role="status" aria-live="polite">Loading your blocks…</div></div>
  </div>

  <!-- Load order matters: db.js and geo.js have no dependencies; api.js
       depends on db.js (token storage); sync.js depends on both api.js and
       db.js; app.js depends on all four. -->
  <script src="/pwa/js/db.js"></script>
  <script src="/pwa/js/api.js"></script>
  <script src="/pwa/js/sync.js"></script>
  <script src="/pwa/js/geo.js"></script>
  <script src="/pwa/js/app.js"></script>
</body>
</html>
