[pytest]
DJANGO_SETTINGS_MODULE = palmvision.settings.test
python_files = tests.py test_*.py *_tests.py
addopts = --reuse-db
# pytest-django gives the DJANGO_SETTINGS_MODULE *environment variable*
# priority over this ini file's setting above — and the web/worker/beat
# containers all run with DJANGO_SETTINGS_MODULE=palmvision.settings.local
# (from .env, needed for `manage.py runserver`/Celery to use local dev
# settings). Without the override below, `pytest` silently ran against
# settings.local instead of settings.test — CELERY_TASK_ALWAYS_EAGER never
# actually applied, so Celery-touching tests either hung waiting on a
# worker or asserted on a status that hadn't happened yet.
#
# pytest-env's "env" list below forces this unconditionally — no flag
# prefix means "always set, overwriting whatever's already in the
# environment." (Easy to get backwards: pytest-env's "D:" flag actually
# means the OPPOSITE — "only set if not already defined" — verified
# against the installed pytest-env source, not assumed from memory, after
# an earlier version of this file used "D:" and it silently did nothing.)
env =
    DJANGO_SETTINGS_MODULE=palmvision.settings.test
